plugins {
    id 'com.android.application'
}

def keystoreFile = file("${rootDir}/../cfgscan.keystore")

android {
    namespace 'com.wpnfa.configscan'
    compileSdk 34

    defaultConfig {
        applicationId "com.wpnfa.configscan"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "1.0.8"
    }

    signingConfigs {
        stable {
            storeFile keystoreFile
            storePassword "wpnfa2026"
            keyAlias "cfgscan"
            keyPassword "wpnfa2026"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
