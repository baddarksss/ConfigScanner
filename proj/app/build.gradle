plugins {
    id 'com.android.application'
}

def keystoreFile = file("${rootDir}/../cfgscan.keystore")

// Signing password is NOT stored in the repo. Provide it via the
// CFGSCAN_KEY_PASS environment variable or -PcfgscanKeyPass=... at build time.
// Without it, builds fall back to the normal debug signature.
def ksPass = System.getenv("CFGSCAN_KEY_PASS") ?: project.findProperty("cfgscanKeyPass")

android {
    namespace 'com.wpnfa.configscan'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.wpnfa.configscan"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "1.0.9"
    }

    signingConfigs {
        stable {
            storeFile keystoreFile
            storePassword ksPass
            keyAlias "cfgscan"
            keyPassword ksPass
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig ksPass ? signingConfigs.stable : signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig ksPass ? signingConfigs.stable : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
