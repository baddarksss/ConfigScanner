name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # The keystore is NOT in the repo. To get update-safe (same-signature)
      # APKs from CI, add these two repository secrets:
      #   CFGSCAN_KEYSTORE_BASE64  -> base64 of cfgscan-v2.keystore
      #                               (base64 -w0 cfgscan-v2.keystore)
      #   CFGSCAN_KEY_PASS         -> the keystore/key password
      # Without them the APK is debug-signed (builds fine, but Android
      # refuses to install it OVER an app signed with the real key).
      - name: Decode signing keystore (if secret provided)
        env:
          KS_B64: ${{ secrets.CFGSCAN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "${{ github.workspace }}/cfgscan-v2.keystore"
            echo "keystore decoded: $(stat -c%s "${{ github.workspace }}/cfgscan-v2.keystore") bytes"
          else
            echo "CFGSCAN_KEYSTORE_BASE64 not set — APK will be debug-signed"
          fi

      - name: Build release APK
        working-directory: proj
        env:
          CFGSCAN_KEY_PASS: ${{ secrets.CFGSCAN_KEY_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: Collect APK
        run: |
          SRC=proj/app/build/outputs/apk/release/app-release.apk
          [ -f "$SRC" ] || SRC=proj/app/build/outputs/apk/release/app-release-unsigned.apk
          cp "$SRC" "ConfigScanner-${GITHUB_REF_NAME}.apk"
          ls -la ConfigScanner-*.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConfigScanner-apk
          path: ConfigScanner-*.apk

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ConfigScanner-*.apk
          generate_release_notes: true
